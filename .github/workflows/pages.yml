name: Publish CommerceFlow Showcase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Copy documentation into showcase
        run: |
          mkdir -p public/docs public/.github/workflows
          cp requirements.md public/requirements.md
          cp docs/assumptions-and-limitations.md public/docs/
          cp docs/traceability-matrix.md public/docs/
          cp docs/security-baseline.md public/docs/
          cp .github/workflows/ci.yml public/.github/workflows/ci.yml

      - name: Upload showcase
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4